name: Runtime release gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

jobs:
  runtime:
    name: runtime (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: WordPress 6.2.11 - PHP 7.4 - ACF 6.8.9
            wordpress: 6.2.11
            php: '7.4'
            woocommerce: ''
          - label: WordPress 7.0.4 - PHP 8.3 - ACF 6.8.9 - WooCommerce 11.0.1
            wordpress: 7.0.4
            php: '8.3'
            woocommerce: 11.0.1
          - label: WordPress 7.1 - PHP 8.3 - ACF 6.8.9 - WooCommerce 11.0.1
            wordpress: 7.1
            php: '8.3'
            woocommerce: 11.0.1
          - label: WordPress 7.1 - PHP 8.5 - ACF 6.8.9
            wordpress: 7.1
            php: '8.5'
            woocommerce: ''

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: mysqli

      - name: Install verified WP-CLI 2.12.0
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            --output wp-cli.phar \
            https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          echo 'ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c  wp-cli.phar' | sha256sum --check --strict
          php wp-cli.phar --info

      - name: Build release ZIP
        run: python scripts/build_release.py

      - name: Create clean WordPress site
        shell: bash
        run: |
          set -euo pipefail
          mkdir runtime-site
          php wp-cli.phar core download \
            --path=runtime-site \
            --version='${{ matrix.wordpress }}' \
            --locale=en_US \
            --force
          php wp-cli.phar config create \
            --path=runtime-site \
            --dbname=wordpress \
            --dbuser=root \
            --dbpass=root \
            --dbhost=127.0.0.1:3306
          php wp-cli.phar config set WP_DEBUG true --raw --path=runtime-site
          php wp-cli.phar config set WP_DEBUG_LOG true --raw --path=runtime-site
          php wp-cli.phar core install \
            --path=runtime-site \
            --url=http://content-sync.test \
            --title='Content Sync Runtime' \
            --admin_user=admin \
            --admin_password='runtime-only-password' \
            --admin_email=runtime@example.invalid \
            --skip-email

      - name: Install pinned ecosystem plugins
        shell: bash
        run: |
          set -euo pipefail
          php wp-cli.phar plugin install advanced-custom-fields \
            --path=runtime-site \
            --version=6.8.9 \
            --activate
          if [[ -n '${{ matrix.woocommerce }}' ]]; then
            php wp-cli.phar plugin install woocommerce \
              --path=runtime-site \
              --version='${{ matrix.woocommerce }}' \
              --activate
          fi
          if [[ '${{ matrix.wordpress }}' == '7.0.4' && '${{ matrix.php }}' == '8.3' ]]; then
            php wp-cli.phar plugin install plugin-check \
              --path=runtime-site \
              --version=2.1.0 \
              --activate
          fi

      - name: Reset upstream setup debug log
        shell: bash
        run: |
          set -euo pipefail
          rm -f runtime-site/wp-content/debug.log

      - name: Install and update release ZIP
        shell: bash
        run: |
          set -euo pipefail
          package="$(realpath dist/content-sync-manager-*.zip)"
          php wp-cli.phar plugin install "$package" --path=runtime-site --activate
          php wp-cli.phar plugin install "$package" --path=runtime-site --force
          php wp-cli.phar plugin status content-sync-manager --path=runtime-site

      - name: Official Plugin Check
        if: matrix.wordpress == '7.0.4' && matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          php wp-cli.phar plugin check content-sync-manager \
            --path=runtime-site \
            --require="$GITHUB_WORKSPACE/runtime-site/wp-content/plugins/plugin-check/cli.php" \
            --categories=general,security,performance,accessibility \
            --format=table

      - name: Exercise export, preview, import and restore
        env:
          DCA_RUNTIME_EXPECT_WOOCOMMERCE: ${{ matrix.woocommerce != '' && '1' || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          php wp-cli.phar eval-file \
            "$GITHUB_WORKSPACE/tests/runtime-smoke.php" \
            --path=runtime-site \
            --user=1
          php wp-cli.phar eval-file \
            "$GITHUB_WORKSPACE/tests/ai-image-context-runtime-hardening.php" \
            --path=runtime-site \
            --user=1

      - name: Reject unexpected WordPress debug errors
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_runtime_debug_log.py runtime-site/wp-content/debug.log
