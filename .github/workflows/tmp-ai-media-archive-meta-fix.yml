name: Temporary AI media archive metadata fix

on:
  push:
    branches:
      - fix/ai-media-archive-meta-false-positive

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/ai-media-archive-meta-false-positive
      - name: Apply archival metadata exclusion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          php_path = Path('includes/ai-image-context.php')
          text = php_path.read_text()
          marker = "function dca_tb_ai_image_context_private_meta_url_refs($post_id, $url_targets) {"
          helper = r'''function dca_tb_ai_image_context_private_meta_is_archival($meta_key) {
              $meta_key = (string) $meta_key;

              if ($meta_key === '') {
                  return false;
              }

              if (strpos($meta_key, '_dca_tb_') === 0) {
                  return true;
              }

              return in_array($meta_key, [
                  '_edit_lock',
                  '_edit_last',
                  '_wp_old_slug',
                  '_wp_trash_meta_status',
                  '_wp_trash_meta_time',
              ], true);
          }

          '''
          if marker not in text:
              raise SystemExit('private meta function marker not found')
          text = text.replace(marker, helper + marker, 1)

          old = "        if ($meta_key === '' || strpos($meta_key, '_') !== 0) {\n            continue;\n        }"
          new = "        if ($meta_key === '' || strpos($meta_key, '_') !== 0 || dca_tb_ai_image_context_private_meta_is_archival($meta_key)) {\n            continue;\n        }"
          if old not in text:
              raise SystemExit('private meta skip marker not found')
          text = text.replace(old, new, 1)
          php_path.write_text(text)

          static_path = Path('tests/ai-image-context-static.php')
          static = static_path.read_text()
          marker = "$assert(strpos($module, 'dca_tb_ai_image_context_private_meta_url_refs') !== false, 'Private builder metadata must be scanned before physical media renames.');\n"
          addition = marker + "$assert(strpos($module, 'dca_tb_ai_image_context_private_meta_is_archival') !== false && strpos($module, \"strpos(\\$meta_key, '_dca_tb_') === 0\") !== false, 'Content Sync archival metadata must be excluded from live private-media URL blockers.');\n"
          if marker not in static:
              raise SystemExit('static private metadata marker not found')
          static = static.replace(marker, addition, 1)
          static_path.write_text(static)

          runtime_path = Path('tests/ai-image-context-runtime-hardening.php')
          runtime = runtime_path.read_text()
          marker = "delete_post_meta($builder_post_id, '_elementor_data');\n\n$author_login ="
          block = r'''delete_post_meta($builder_post_id, '_elementor_data');
          update_post_meta($builder_post_id, '_dca_tb_backups', [[
              'created' => current_time('mysql'),
              'source' => 'runtime-hardening',
              'textblock' => "Archived Content Sync snapshot\n" . $thumbnail_url,
          ]]);

          $archive_scan = dca_tb_ai_image_context_site_usage_scan([$attachment_id]);
          $archive_entries = isset($archive_scan['usage'][$attachment_id]) ? $archive_scan['usage'][$attachment_id] : [];
          $archive_blocked = false;
          foreach ($archive_entries as $entry) {
              if (!empty($entry['unsafe_private_meta']) || in_array('meta:_dca_tb_backups', (array) ($entry['sources'] ?? []), true)) {
                  $archive_blocked = true;
                  break;
              }
          }
          $assert(!$archive_blocked, 'Content Sync archival backup metadata must not be treated as live builder/private media usage.');

          $archive_preview = dca_tb_ai_image_context_preview_media_import($rename_import($import_block, 'archive-safe-name'));
          $assert(!is_wp_error($archive_preview), 'Archive-only rename preview failed unexpectedly.');
          $assert(($archive_preview['items'][0]['status'] ?? '') === 'success', 'Archive-only metadata must not downgrade a safe rename preview.');
          $assert(!empty($archive_preview['items'][0]['rename_allowed']), 'Archive-only metadata must not block a safe physical rename.');
          delete_post_meta($builder_post_id, '_dca_tb_backups');

          $author_login ='''
          if marker not in runtime:
              raise SystemExit('runtime archive insertion marker not found')
          runtime = runtime.replace(marker, block, 1)
          runtime_path.write_text(runtime)

          readme_path = Path('README.md')
          readme = readme_path.read_text()
          old = "Een fysieke hernoeming wordt fail-closed geblokkeerd als de gebruiksscan onvolledig is, als een vaste media-URL in private/buildermetadata zoals Elementor `_elementor_data` wordt gevonden, als een niet-ondersteunde opslaglocatie wordt gebruikt of als de huidige gebruiker niet iedere betrokken gebruikspagina mag bewerken. Veilige metadatawijzigingen kunnen dan nog wel doorgaan."
          new = old + " Interne Content Sync-archiefmeta zoals `_dca_tb_backups` telt bewust niet als actieve gebruikslocatie."
          if old not in readme:
              raise SystemExit('README hardening paragraph marker not found')
          readme_path.write_text(readme.replace(old, new, 1))

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text()
          old = "- Context: export bevat een WordPress-gebruiksscan en exacte ACF-paden voor gallery, group, repeater en flexible content waar beschikbaar; vaste media-URLs in private/buildermetadata zoals Elementor `_elementor_data` worden als onveilige rename-locatie gedetecteerd."
          new = old + " Interne Content Sync-archiefmeta zoals `_dca_tb_backups` wordt daarbij uitgesloten om false positives te voorkomen."
          if old not in changelog:
              raise SystemExit('CHANGELOG context marker not found')
          changelog_path.write_text(changelog.replace(old, new, 1))
          PY

          rm .github/workflows/tmp-ai-media-archive-meta-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add includes/ai-image-context.php tests/ai-image-context-static.php tests/ai-image-context-runtime-hardening.php README.md CHANGELOG.md .github/workflows/tmp-ai-media-archive-meta-fix.yml
          git commit -m 'Exclude archival metadata from media rename blockers'
          git push origin HEAD:fix/ai-media-archive-meta-false-positive
