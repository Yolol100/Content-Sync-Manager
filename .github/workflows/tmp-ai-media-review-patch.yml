name: Temporary AI media review patch

on:
  push:
    branches:
      - fix/ai-media-review-hardening

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/ai-media-review-hardening
      - name: Apply focused review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          php_path = Path('includes/ai-image-context.php')
          text = php_path.read_text()
          start_marker = 'function dca_tb_ai_image_context_value_contains_url'
          end_marker = 'function dca_tb_ai_image_context_usage_post_types'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          new_block = r'''function dca_tb_ai_image_context_normalize_media_url($url) {
              $url = html_entity_decode((string) $url, ENT_QUOTES, 'UTF-8');
              $url = str_replace('\\/', '/', trim($url));

              return $url;
          }

          function dca_tb_ai_image_context_add_media_url_target(&$targets, $url, $attachment_id) {
              $attachment_id = absint($attachment_id);
              $url = dca_tb_ai_image_context_normalize_media_url($url);

              if (!$attachment_id || $url === '') {
                  return;
              }

              if (!isset($targets['urls'][$url])) {
                  $targets['urls'][$url] = [];
              }
              $targets['urls'][$url][$attachment_id] = true;

              $path = wp_parse_url($url, PHP_URL_PATH);
              $path = is_string($path) ? rawurldecode($path) : '';
              if ($path !== '') {
                  if (!isset($targets['paths'][$path])) {
                      $targets['paths'][$path] = [];
                  }
                  $targets['paths'][$path][$attachment_id] = true;
              }
          }

          function dca_tb_ai_image_context_attachment_url_targets($attachment_ids) {
              $attachment_ids = array_values(array_unique(array_filter(array_map('absint', (array) $attachment_ids))));
              $targets = [
                  'urls' => [],
                  'paths' => [],
              ];

              foreach ($attachment_ids as $attachment_id) {
                  $urls = [];
                  $full_url = wp_get_attachment_url($attachment_id);
                  if (is_string($full_url) && $full_url !== '') {
                      $urls[] = $full_url;
                  }

                  if (function_exists('wp_get_original_image_url')) {
                      $original_url = wp_get_original_image_url($attachment_id);
                      if (is_string($original_url) && $original_url !== '') {
                          $urls[] = $original_url;
                      }
                  }

                  $metadata = wp_get_attachment_metadata($attachment_id);
                  $sizes = is_array($metadata) && !empty($metadata['sizes']) && is_array($metadata['sizes'])
                      ? array_keys($metadata['sizes'])
                      : [];

                  foreach ($sizes as $size_name) {
                      $src = wp_get_attachment_image_src($attachment_id, $size_name);
                      if ($src && !empty($src[0])) {
                          $urls[] = (string) $src[0];
                      }
                  }

                  foreach (array_values(array_unique($urls)) as $url) {
                      dca_tb_ai_image_context_add_media_url_target($targets, $url, $attachment_id);
                  }
              }

              return $targets;
          }

          function dca_tb_ai_image_context_collect_target_attachment_ids($value, $targets, $depth = 0) {
              if ($depth > 10 || !is_array($targets)) {
                  return [];
              }

              $found = [];

              if (is_array($value)) {
                  foreach ($value as $item) {
                      foreach (dca_tb_ai_image_context_collect_target_attachment_ids($item, $targets, $depth + 1) as $attachment_id) {
                          $found[absint($attachment_id)] = true;
                      }
                  }
                  return array_values(array_filter(array_map('absint', array_keys($found))));
              }

              if (is_object($value)) {
                  return dca_tb_ai_image_context_collect_target_attachment_ids(get_object_vars($value), $targets, $depth + 1);
              }

              if (!is_scalar($value)) {
                  return [];
              }

              $text = html_entity_decode((string) $value, ENT_QUOTES, 'UTF-8');
              $text = str_replace('\\/', '/', $text);
              if ($text === '') {
                  return [];
              }

              if (!preg_match_all("~https?://[^[:space:]<>\\\"']+~i", $text, $matches)) {
                  return [];
              }

              foreach ((array) ($matches[0] ?? []) as $candidate) {
                  $candidate = dca_tb_ai_image_context_normalize_media_url(rtrim((string) $candidate, '.,;)]}'));
                  if ($candidate === '') {
                      continue;
                  }

                  if (isset($targets['urls'][$candidate])) {
                      foreach ((array) $targets['urls'][$candidate] as $attachment_id => $enabled) {
                          if ($enabled) {
                              $found[absint($attachment_id)] = true;
                          }
                      }
                  }

                  $path = wp_parse_url($candidate, PHP_URL_PATH);
                  $path = is_string($path) ? rawurldecode($path) : '';
                  if ($path !== '' && isset($targets['paths'][$path])) {
                      foreach ((array) $targets['paths'][$path] as $attachment_id => $enabled) {
                          if ($enabled) {
                              $found[absint($attachment_id)] = true;
                          }
                      }
                  }
              }

              return array_values(array_filter(array_map('absint', array_keys($found))));
          }

          function dca_tb_ai_image_context_private_meta_url_refs($post_id, $url_targets) {
              $post_id = absint($post_id);
              $refs = [];

              if (!$post_id || !is_array($url_targets) || (empty($url_targets['urls']) && empty($url_targets['paths']))) {
                  return $refs;
              }

              $all_meta = get_post_meta($post_id);
              if (!is_array($all_meta)) {
                  return $refs;
              }

              foreach ($all_meta as $meta_key => $values) {
                  $meta_key = (string) $meta_key;
                  if ($meta_key === '' || strpos($meta_key, '_') !== 0) {
                      continue;
                  }

                  $attachment_ids = dca_tb_ai_image_context_collect_target_attachment_ids($values, $url_targets);
                  if (!$attachment_ids) {
                      continue;
                  }

                  $source = 'meta:' . $meta_key;
                  foreach ($attachment_ids as $attachment_id) {
                      $attachment_id = absint($attachment_id);
                      if (!$attachment_id) {
                          continue;
                      }
                      if (!isset($refs[$attachment_id])) {
                          $refs[$attachment_id] = [];
                      }
                      if (!in_array($source, $refs[$attachment_id], true)) {
                          $refs[$attachment_id][] = $source;
                      }
                  }
              }

              return $refs;
          }

          '''
          text = text[:start] + new_block + text[end:]

          target_line = "    $targets = array_fill_keys($attachment_ids, true);\n"
          replacement_line = target_line + "    $private_meta_targets = dca_tb_ai_image_context_attachment_url_targets($attachment_ids);\n"
          if target_line not in text:
              raise SystemExit('site usage target setup marker not found')
          text = text.replace(target_line, replacement_line, 1)

          old_call = "        $private_meta_refs = dca_tb_ai_image_context_private_meta_url_refs($post_id, $attachment_ids);"
          new_call = "        $private_meta_refs = dca_tb_ai_image_context_private_meta_url_refs($post_id, $private_meta_targets);"
          if old_call not in text:
              raise SystemExit('private metadata scan call marker not found')
          text = text.replace(old_call, new_call, 1)
          php_path.write_text(text)

          runtime_path = Path('tests/ai-image-context-runtime-hardening.php')
          runtime = runtime_path.read_text()
          old = "$attachment_url = wp_get_attachment_url($attachment_id);\nupdate_post_meta($builder_post_id, '_elementor_data', wp_json_encode(["
          new = "$attachment_url = wp_get_attachment_url($attachment_id);\n$thumbnail_src = wp_get_attachment_image_src($attachment_id, 'thumbnail');\n$assert($thumbnail_src && !empty($thumbnail_src[0]), 'Hard-cropped thumbnail URL is unavailable for builder metadata fixture.');\n$thumbnail_url = (string) $thumbnail_src[0];\n$assert($thumbnail_url !== $attachment_url, 'Builder metadata fixture must use an intermediate-size URL.');\n$target_map = dca_tb_ai_image_context_attachment_url_targets([$attachment_id]);\n$assert(isset($target_map['urls'][$thumbnail_url][$attachment_id]), 'Intermediate-size attachment URL must be precomputed as a private metadata safety target.');\nupdate_post_meta($builder_post_id, '_elementor_data', wp_json_encode(["
          if old not in runtime:
              raise SystemExit('runtime attachment URL marker not found')
          runtime = runtime.replace(old, new, 1)
          old_url = "                'url' => $attachment_url,"
          if old_url not in runtime:
              raise SystemExit('runtime builder URL marker not found')
          runtime = runtime.replace(old_url, "                'url' => $thumbnail_url,", 1)
          runtime_path.write_text(runtime)

          static_path = Path('tests/ai-image-context-static.php')
          static = static_path.read_text()
          marker = "$assert(strpos($module, 'dca_tb_ai_image_context_private_meta_url_refs') !== false, 'Private builder metadata must be scanned before physical media renames.');\n"
          addition = marker + "$assert(strpos($module, 'dca_tb_ai_image_context_attachment_url_targets') !== false, 'Private metadata scan must precompute full and intermediate attachment URL targets.');\n$assert(strpos($module, 'dca_tb_ai_image_context_collect_target_attachment_ids') !== false, 'Private metadata values must be traversed once against the precomputed URL target map.');\n"
          if marker not in static:
              raise SystemExit('static private metadata marker not found')
          static = static.replace(marker, addition, 1)
          static_path.write_text(static)
          PY

          rm .github/workflows/tmp-ai-media-review-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add includes/ai-image-context.php tests/ai-image-context-runtime-hardening.php tests/ai-image-context-static.php .github/workflows/tmp-ai-media-review-patch.yml
          git commit -m 'Finish private media URL safety hardening'
          git push origin HEAD:fix/ai-media-review-hardening
