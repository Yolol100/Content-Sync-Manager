name: Plugin quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-and-syntax:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)

      - name: JavaScript syntax
        run: node --check assets/admin.js

      - name: Static regression audit
        run: php tests/static-audit.php

      - name: Package hygiene
        shell: bash
        run: |
          set -euo pipefail
          test ! -e admin.js
          test ! -e manager.php
          test -f content-sync-manager.php
          test -f includes/manager.php
          test -f assets/admin.js
          test -f assets/admin.css
