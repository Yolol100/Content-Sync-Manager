name: Plugin quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-and-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find assets -maxdepth 1 -type f -name '*.js' -print0)

      - name: Static regression audit
        run: |
          php tests/static-audit.php
          php tests/ai-image-context-static.php
          php tests/ai-media-index-static.php

      - name: Package hygiene
        shell: bash
        run: |
          set -euo pipefail
          test ! -e admin.js
          test ! -e manager.php
          test -f content-sync-manager.php
          test -f includes/manager.php
          test -f includes/ai-image-context.php
          test -f includes/ai-media-index.php
          test -f assets/admin.js
          test -f assets/ai-image-context.js
          test -f assets/admin.css

      - name: Reproducible release package
        if: matrix.php == '8.3'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_release.py
          first_checksum="$(cut -d ' ' -f 1 dist/*.sha256)"
          python scripts/build_release.py
          second_checksum="$(cut -d ' ' -f 1 dist/*.sha256)"
          test "$first_checksum" = "$second_checksum"
          php tests/static-audit.php
          php tests/ai-image-context-static.php
          php tests/ai-media-index-static.php

  wordpress-best-practices:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Validate locked tooling
        shell: bash
        run: |
          set -euo pipefail
          composer validate --strict --no-interaction
          composer install --no-interaction --prefer-dist --no-progress
          composer audit --locked --format=json

      - name: WordPress Coding Standards
        shell: bash
        run: |
          set -euo pipefail
          vendor/bin/phpcs --standard=phpcs.xml.dist
